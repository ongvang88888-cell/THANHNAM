<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Làn dừng khẩn cấp">
  <rect width="640" height="400" fill="#dfece8"/>
  <rect x="0" y="100" width="640" height="200" fill="#5a6570"/>
  <rect x="0" y="280" width="640" height="50" fill="#6b7680"/>
  <line x1="0" y1="280" x2="640" y2="280" stroke="#f5d547" stroke-width="4"/>
  <line x1="320" y1="100" x2="320" y2="280" stroke="#fff" stroke-width="4" stroke-dasharray="18 14"/>
  <rect x="120" y="300" width="70" height="28" rx="6" fill="#c45c26"/>
  <text x="24" y="40" fill="#0c1f24" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Làn dừng khẩn cấp (cao tốc)</text>
  <text x="24" y="68" fill="#2a454c" font-family="system-ui,sans-serif" font-size="14">Chỉ dùng khi sự cố; bật đèn cảnh báo, đặt biển báo hiệu nếu cần</text>
</svg>
