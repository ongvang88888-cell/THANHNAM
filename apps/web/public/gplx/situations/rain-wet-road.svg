<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Đường mưa trơn">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9bb3c4"/>
      <stop offset="100%" stop-color="#c5d5df"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <rect x="0" y="220" width="640" height="180" fill="#4a5560"/>
  <line x1="320" y1="220" x2="320" y2="400" stroke="#fff" stroke-width="4" stroke-dasharray="18 14"/>
  <g stroke="#6a8aa0" stroke-width="2">
    <line x1="80" y1="40" x2="60" y2="90"/><line x1="160" y1="30" x2="140" y2="85"/>
    <line x1="240" y1="50" x2="220" y2="100"/><line x1="360" y1="35" x2="340" y2="90"/>
    <line x1="440" y1="45" x2="420" y2="95"/><line x1="540" y1="30" x2="520" y2="85"/>
  </g>
  <ellipse cx="200" cy="300" rx="40" ry="10" fill="#6b7c8a" opacity="0.5"/>
  <rect x="160" y="250" width="80" height="40" rx="8" fill="#0b6e63"/>
  <text x="24" y="40" fill="#0c1f24" font-family="system-ui,sans-serif" font-size="18" font-weight="700">Trời mưa / đường trơn</text>
  <text x="24" y="68" fill="#2a454c" font-family="system-ui,sans-serif" font-size="14">Giảm tốc, tăng khoảng cách, tránh phanh/đánh lái đột ngột</text>
</svg>
